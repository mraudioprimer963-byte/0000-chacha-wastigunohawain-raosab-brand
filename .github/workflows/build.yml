name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false

      - name: Build
        shell: pwsh
        run: |
          go mod init easiactivation
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o Easiactivation.exe .
