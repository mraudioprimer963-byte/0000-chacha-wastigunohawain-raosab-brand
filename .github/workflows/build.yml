name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.20 (Win7 Compatible)
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false

      - name: go mod tidy
        run: go mod tidy

      - name: Generate Resource (Icon)
        shell: pwsh
        run: |
          # Downloads the tool to turn .ico into a Windows resource
          go install github.com/akavel/rsrc@latest
          # Embeds logo.ico into a file called rsrc.syso
          rsrc -ico logo.ico -o rsrc.syso

      - name: build Easiactivation.exe
        shell: pwsh
        run: |
          # Build with icon and windowsgui so no black box appears
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o Easiactivation.exe .

      - name: build keygen.exe
        shell: pwsh
        run: |
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o keygen.exe ./cmd/keygen

      - uses: actions/upload-artifact@v4
        with:
          name: Easiactivation
          path: |
            Easiactivation.exe
            keygen.exe
