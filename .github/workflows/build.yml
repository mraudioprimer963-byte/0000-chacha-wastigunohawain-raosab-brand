name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false

      - name: Force Go to print errors
        shell: pwsh
        run: |
          go env -w CGO_ENABLED=0
          go mod tidy 2>&1 | Tee-Object -Variable tidyLog
          if ($LASTEXITCODE -ne 0) { Write-Error $tidyLog; exit 1 }
          
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o Easiactivation.exe . 2>&1 | Tee-Object -Variable buildLog
          if ($LASTEXITCODE -ne 0) { Write-Error $buildLog; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Easiactivation
          path: Easiactivation.exe
