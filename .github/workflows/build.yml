name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: go mod tidy
        run: go mod tidy

      - name: build Easiactivation.exe
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o Easiactivation.exe .

      - name: build keygen.exe
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o keygen.exe ./cmd/keygen

      - uses: actions/upload-artifact@v4
        with:
          name: Easiactivation
          path: |
            Easiactivation.exe
            keygen.exe
